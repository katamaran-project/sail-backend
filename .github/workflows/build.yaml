name: Build and Test Sail Backend

on:
  push:
  pull_request:

env:
  # Keep these in sync with the opam switch used for development and with flake.nix.
  OCAML_VERSION: "5.5.1"
  SAIL_VERSION: "0.20.3"

jobs:
  # Builds the plugin with opam, as described in docs/installation.md, and runs the unit tests.
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Sail's system dependencies (see docs/installation.md).
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev z3 opam pkg-config zlib1g-dev

      # The cache holds the whole opam root (compiler, Sail and all other dependencies).
      # Its key changes whenever the OCaml or Sail version, dune-project or this workflow changes,
      # so a stale cache is never reused. There are no fallback keys on purpose:
      # either the cache matches exactly, or everything is installed from scratch.
      - name: Restore opam cache
        id: opam-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.opam
          key: ${{ runner.os }}-opam-ocaml${{ env.OCAML_VERSION }}-sail${{ env.SAIL_VERSION }}-${{ hashFiles('dune-project', '.github/workflows/build.yaml') }}

      - name: Set up opam
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: |
          opam init --yes --no-setup --disable-sandboxing --shell=sh --compiler=${OCAML_VERSION}

      # The .opam files are not tracked in git; dune generates them from dune-project.
      # They are needed by `opam install . --deps-only`, so generate them first.
      - name: Install dependencies
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: |
          opam update -y
          opam pin add -y sail ${SAIL_VERSION}
          opam install -y dune
          opam exec -- dune build monads.opam nanosail.opam sail_katamaran_backend.opam
          opam install -y . --deps-only
          opam install -y ounit2

      - name: Save opam cache
        if: steps.opam-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.opam
          key: ${{ steps.opam-cache.outputs.cache-primary-key }}

      - name: Build project
        run: opam exec -- dune build

      - name: Run unit tests
        run: opam exec -- dune test

  # Runs the other test suites (see docs/tests.md) in the Nix development shell of flake.nix,
  # which provides Rocq and the Katamaran library that the end-to-end tests compile against.
  # Katamaran comes prebuilt from its cachix when it is still there (that cache evicts old builds,
  # and building Katamaran takes about 30 minutes); everything else from cache.nixos.org,
  # except Sail and this project, which are built here. So the Nix store is cached too.
  test:
    runs-on: ubuntu-22.04

    # Needed by cache-nix-action to purge outdated Nix store caches.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # A single-user installation, so that the Nix store belongs to the runner user:
      # cache-nix-action restores the store with tar as that user, which fails on the
      # root-owned store of a multi-user installation (such as cachix/install-nix-action's).
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            extra-substituters = https://katamaran.cachix.org
            extra-trusted-public-keys = katamaran.cachix.org-1:6oOkbLd/LRTGiixl0cVyWC2/OXo5A0l1e84jqZf+dCE=

      # Keyed by the flake, so that a new cache is saved whenever the development shell changes;
      # until then, the newest older cache is restored, so only what changed is fetched or built.
      # Older caches of this branch are purged after a new one is saved, to stay under
      # GitHub's cache size limit.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-v2-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-v2-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-v2-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Set up development shell
        run: nix develop --command true

      # The coqc verdicts of the end-to-end tests, keyed by the generated Coq and the Coq installation
      # (see docs/tests.md), so an entry can never be stale. Each run saves a new cache, which
      # the next run restores.
      - name: Restore Coq cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sail-backend/coq-cache
          key: coq-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: coq-cache-${{ runner.os }}-

      - name: Build project
        run: nix develop --command make build

      - name: Run template tests
        run: nix develop --command make template-tests

      # Runs the tests in tests/coq-tests, which must pass, and those in tests/coq-tests/expected-failing,
      # which must fail: one that passes (XPASS) fails this step, and should be moved out of expected-failing.
      - name: Run end-to-end tests
        run: nix develop --command make end-to-end-tests

      - name: Upload end-to-end test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: end-to-end-test-results
          path: |
            tests/coq-tests/test-output/2*/summary.txt
            tests/coq-tests/test-output/2*/failures.txt
            tests/coq-tests/test-output/2*/unexpected.txt
            tests/coq-tests/test-output/2*/*/output.txt
            tests/coq-tests/test-output/2*/*/result.json
            tests/coq-tests/test-output/2*/*/*.v
          if-no-files-found: ignore
