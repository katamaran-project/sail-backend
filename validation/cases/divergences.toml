# Expected divergences (validate.md, "Known divergences"): one table per case in
# validation/cases. validate.py reports `expected divergence at step N` only if
#   - the states are equal up to step - 1 and differ at `step`;
#   - Rocq stops there (`rocq.stop`) and its delta at `step` (vs step - 1) is `rocq.delta`;
#   - the emulator's delta at `step` is `emulator.delta` and its htif exit code `emulator.exit`.
# An entry with `emulator.stop` and `emulator.message` instead of `emulator.exit` and
# `emulator.delta` records both sides stopping: validate.py reports `both stop at step N`
# only if Rocq is as above and the emulator stops in `step` (states up to step - 1, none at
# `step`, no htif exit), its output saying "Assertion failed: <msg>" (`stop = "assertion"`)
# or "Exiting due to uncaught exception: <msg>" (`stop = "exception"`), with
# `emulator.message` a substring of <msg>.
# Anything else (passes, diverges earlier/later or differently) fails, with the
# recorded and actual deltas in validation/build/validate/<case>/divergence.txt.
# Deltas: state-format.md lines, sorted as there.

[umode]
what = "MRET with `mstatus.MPP` = 0 enters User although `misa.U` = 0; the next step"
reason = "`dispatchInterrupt` asserts the privilege is Machine when U-mode is absent: µSail `stm_fail`, the emulator's assertion fails"
doc = "validation/docs/validate.md#both-sides-stop"
step = 11
rocq.stop = "Failed"
rocq.delta = [
  'step_result "invalid current privilege"',
]
emulator.stop = "assertion"
emulator.message = "invalid current privilege"

[untagged-mtcc]
what = "trap to an untagged MTCC: the fetch finds PCC and MTCC untagged"
reason = "`ext_fetch_check_pc` calls `not_implemented`, a `throw` (`riscv_types.sail:88`): µSail `stm_fail`, the emulator's exception is uncaught"
doc = "validation/docs/validate.md#both-sides-stop"
step = 7
rocq.stop = "Failed"
rocq.delta = [
  'step_result "failure"',
]
emulator.stop = "exception"
emulator.message = "riscv_types.sail:88"

[csrw-mtvec]
what = "`csrrw a1, mtvec, a0`: CHERIoT's `set_mtvec` is `internal_error`"
reason = "`internal_error` asserts false: µSail `stm_fail` (the message, computed at run time, is dropped), the emulator's assertion fails"
doc = "validation/docs/validate.md#both-sides-stop"
step = 6
rocq.stop = "Failed"
rocq.delta = [
  'instbits 0x305515f3',
  'nextPC 0x80000018',
  'step_result "assertion failed (message computed at run time, dropped by the translation)"',
]
emulator.stop = "assertion"
emulator.message = "cheri_sys_exceptions.sail:144: unsupported"

[csrw-mepc]
what = "`csrrw a1, mepc, a0`: CHERIoT's `set_xret_target` is `internal_error`"
reason = "as `csrw-mtvec`"
doc = "validation/docs/validate.md#both-sides-stop"
step = 6
rocq.stop = "Failed"
rocq.delta = [
  'instbits 0x341515f3',
  'nextPC 0x80000018',
  'step_result "assertion failed (message computed at run time, dropped by the translation)"',
]
emulator.stop = "assertion"
emulator.message = "cheri_sys_exceptions.sail:117: unsupported"
